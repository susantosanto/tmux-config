# ============================================================================
# Konfigurasi Tmux dengan Tema Oasis

# Definisikan warna-warna yang digunakan
set -g @color-gray-light "#aaaaaa"
set -g @color-gray-medium "#666666"
set -g @color-gray-dark "#444444"
set -g @color-green-soft "#859900"
set -g @color-cyan-soft "#2aa198"
set -g @color-blue-muted "#5f87d7"

# Aktifkan mouse support
set -g mouse on
# Aktifkan 256 color mode
set -g default-terminal "screen-256color"
# Aktifkan activity/monitoring alerts
# set -g monitor-activity on  # Commented for WSL performance
# setw -g monitor-activity on  # Commented for WSL performance
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# style

# Custom style
set -g status-left-length 100
set -g status-style "fg=#aaaaaa,bg=default"
set -g status-right-style "bg=default"
set -g status-left " #[fg=#aaaaaa,bold]  #S #[fg=#aaaaaa,nobold] | "
set -g status-right "#{cpu_fg_color}󰻠 #{cpu_percentage} #[fg=#aaaaaa,nobold] | #[fg=#aaaaaa] %H:%M:%S "
set -g window-status-current-format "#[fg=#ffffff,bold]  #[bold]#I:#W"
set -g window-status-format "#[fg=#aaaaaa] #I:#W"
set -g message-style "fg=#aaaaaa,bg=default"
set -g mode-style "fg=#444444,bg=#5f87d7"
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#666666"

# Gunakan tema oasis - tema estetik dan modern
# set -g @plugin 'wfxr/tmux-power'
# set -g @tmux_power_theme '#859900' # Solarized green
# set -g @tmux_power_g4 "#ffffff"  # Light text on transparent background
# set -g @tmux_power_g0 "default"  # Make main background transparent
# set -g @tmux_power_g2 "#aaaaaa"  # Make inactive tab text gray

# Posisi status bar di atas
set -g status-position top
# Konfigurasi dasar
set -g status-keys vi
set -g history-limit 1000
# Setel background pane ke default untuk efek transparan
set -g pane-active-border-style "fg=colour240,bg=default"
# Setel background window ke default untuk efek transparan
set -g window-active-style "bg=default"
# Timpa warna background dari tema untuk efek transparan
set -g status-style "bg=default"
set -g message-style "bg=default"
set -g mode-style "bg=default"
# Prefix key
unbind C-b
set -g prefix F1
bind F1 send-prefix
# Split window
bind | split-window -h
bind - split-window -v
# Navigasi pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Resize pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# Copy mode navigasi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Scroll in copy mode
bind -T copy-mode-vi C-j send-keys -X page-down
bind -T copy-mode-vi C-k send-keys -X page-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
bind -T copy-mode-vi C-u send-keys -X halfpage-up
# Cari teks
bind / command-prompt -p"search:" "copy-mode -t=; send-keys -X search-forward \"%%\""
# List sessions
bind s choose-tree -s
bind w choose-tree -w
# Move windows
bind -r C-h swap-window -t -1
bind -r C-l swap-window -t +1
# Renumber windows
bind -r n next-window
bind -r p previous-window
# Kill
bind x kill-pane
bind X kill-window
# Create new window
bind c new-window
# Reload config
bind r source-file ~/.tmux.conf

# Jalankan tpm (plugin manager)
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'
# Specific window style settings to make active window more visible with transparent background
# setw -g window-status-format "    #[bg=default,fg=#aaaaaa,nounderscore,noitalics] #I:#W#F    "
# setw -g window-status-current-format "    #[bg=#859900,fg=#ffffff,bold] #I:#W#F    "
#
# Performance optimization for WSL
set -g status-interval 1

# Waktu format tetap menggunakan format standar tmux

# Add tmux-menus plugin
set -g @plugin 'jaclu/tmux-menus'


# Add tmux-command-palette plugin
set -g @plugin 'lost-melody/tmux-command-palette'

# Add tmux-cpu plugin for CPU and memory monitoring
set -g @plugin 'tmux-plugins/tmux-cpu'



# Tmux-menus key bindings
bind m run-shell -b '/home/xcode/.tmux/plugins/tmux-menus/items/main.sh'


# Tmux-command-palette configuration
set -g @cmdpalette-tables 'root,prefix,copy-mode-vi'
set -g @cmdpalette-key-prefix 'prefix ?'
set -g @cmdpalette-key-root 'prefix BSpace'
set -g @cmdpalette-key-copy-mode-vi 'copy-mode-vi C-/'
set -g @cmdpalette-cmdlists 'commands'
set -g @cmdpalette-cmd-commands 'prefix P'
set -g @cmdpalette-render-cmd 'bat -l md -f -pp'
set -g window-style "bg=default,fg=colour242"

# Add margin/border to create space between content and status bar

# Set default window index to 1 instead of 0
set -g base-index 1

# Tmux toggle scratch for temporary panes


# Toggle functionality using zoom
bind-key t resize-pane -Z

# Tmux-cpu plugin configuration
set -g @cpu_low_color "#859900"
set -g @cpu_medium_color "#b58900"
set -g @cpu_high_color "#dc322f"
set -g @cpu_display_percentage true
set -g @cpu_display_usage_bar false
set -g @cpu_display_temp false
set -g @cpu_temp_threshold 70
set -g @cpu_temp_low_color "#859900"
set -g @cpu_temp_medium_color "#b58900"
set -g @cpu_temp_high_color "#dc322f"
set -g @cpu_display_mem_bar false
set -g @cpu_display_frequency false


