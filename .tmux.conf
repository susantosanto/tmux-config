# ============================================================================
# Konfigurasi Tmux dengan Tema Oasis

# Definisikan warna-warna yang digunakan
set -g @color-gray-light "#aaaaaa"
set -g @color-gray-medium "#666666"
set -g @color-gray-dark "#444444"
set -g @color-green-soft "#859900"
set -g @color-cyan-soft "#2aa198"
set -g @color-blue-muted "#5f87d7"
set -g @color-red-osaka  "#d33682"

# Aktifkan 256 color mode
set -g default-terminal "screen-256color"
# Aktifkan activity/monitoring alerts
# set -g monitor-activity on  # Commented for WSL performance
# setw -g monitor-activity on  # Commented for WSL performance

# Nonaktifkan fungsi mouse mode copy, hanya aktifkan fungsi dasar
set -g mouse on  # Opsi mouse tunggal untuk tmux 3.6+

# Nonaktifkan fungsi-fungsi mouse yang tidak lagi digunakan di versi baru
# Opsi mouse pada tmux 3.6+ digabungkan dalam satu set -g mouse

# Wheel mouse untuk scrolling (ini tetap digunakan untuk scrolling manual tanpa mode copy)
bind -T root WheelUpPane if-shell -F -t = '#{mouse_any_flag}' 'send-keys -M' 'if -F "#{pane_in_mode}" "send-keys -M" "copy-mode -e; send-keys -M"'
bind -T root WheelDownPane if-shell -F -t = '#{mouse_any_flag}' 'send-keys -M' 'send-keys -M'

# Nonaktifkan drag mouse yang memicu copy mode
bind -T root MouseDrag1Pane if-shell -F -t = '#{mouse_any_flag}' 'send-keys -M' 'copy-mode -x; send-keys -M'
bind -T root MouseDragEnd1Pane if-shell -F -t = '#{mouse_any_flag}' 'send-keys -M' 'copy-mode -x; send-keys -M'

# Klik untuk paste dari buffer
bind -T root MouseDown3Pane run-shell 'tmux paste-buffer'
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# style

# Custom style
set -g status-left-length 100
set -g status-style "fg=#aaaaaa,bg=default"
set -g status-right-style "bg=default"
set -g status-left " #[fg=default,bold]💀 #[fg=white,bold]XCODE #[fg=#aaaaaa,nobold] | #[fg=#859900,bold]  #S #[fg=#aaaaaa,nobold] | #[fg=#aaaaaa]#(cd #{pane_current_path} 2>/dev/null && git rev-parse --git-dir > /dev/null 2>&1 && echo \"⎇ $(git -C #{pane_current_path} symbolic-ref --short HEAD 2>/dev/null | cut -c1-10)\" 2>/dev/null)#[fg=#aaaaaa,nobold] | "
set -g status-right "#{prefix_highlight}  | #[fg=#aaaaaa]WN:#{session_windows} #[fg=#aaaaaa,nobold] | #[fg=#aaaaaa]WP:#P #[fg=#aaaaaa,nobold] | #[fg=#d33682] %H:%M "
set -g window-status-current-format "#[fg=#859900,bold]  #[bold]#I:#W"
set -g window-status-format "#[fg=#aaaaaa] #I:#W"
set -g message-style "fg=#aaaaaa,bg=default"
set -g mode-style "fg=#001f26,bg=#5f87d7"
set -g pane-border-style "fg=#444444,bg=default"
set -g pane-active-border-style "fg=#859900,bg=default"

# set -g @tmux_power_theme '#859900' # Solarized

# Posisi status bar di atas
# set -g status-position top
set -g status-position bottom
# Konfigurasi dasar
set -g status-keys vi
set -g history-limit 1000
# Setel background window ke default untuk efek transparan
set -g window-active-style "bg=default"
# Timpa warna background dari tema untuk efek transparan
set -g status-style "bg=default"
set -g message-style "bg=default"
set -g mode-style "bg=default"

# Style untuk selection di copy mode
set -g copy-mode-selection-style "fg=#001f26,bg=#859900"  # Warna teks gelap di atas latar belakang hijau sesuai tema
# Prefix key
unbind C-b
set -g prefix F1
bind F1 send-prefix
# Split window - your requested configuration
bind | split-window -h  # Creates left/right panes (vertical split) 
bind - split-window -v  # Creates top/bottom panes (horizontal split)
# Navigasi pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navigasi pane dengan mode window seperti vim (gunakan F1+kemudian h/j/k/l)
bind -T prefix H select-pane -L
bind -T prefix J select-pane -D
bind -T prefix K select-pane -U
bind -T prefix L select-pane -R




# Navigasi window dengan prefix key F1
bind-key -r o previous-window  # F1 + o untuk previous window
bind-key -r p next-window      # F1 + p untuk next window

# Pindah ke pane tertentu dengan angka
bind 1 select-pane -t 1
bind 2 select-pane -t 2
bind 3 select-pane -t 3
bind 4 select-pane -t 4
bind 5 select-pane -t 5
bind 6 select-pane -t 6
bind 7 select-pane -t 7
bind 8 select-pane -t 8
bind 9 select-pane -t 9

# Resize pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch window dengan angka
bind -r 1 select-window -t 1
bind -r 2 select-window -t 2
bind -r 3 select-window -t 3
bind -r 4 select-window -t 4
bind -r 5 select-window -t 5
bind -r 6 select-window -t 6
bind -r 7 select-window -t 7
bind -r 8 select-window -t 8
bind -r 9 select-window -t 9
# Copy mode navigasi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi ' ' send-keys -X begin-selection  # Space untuk mulai selection
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel  # Enter untuk copy dan cancel
# Scroll in copy mode
bind -T copy-mode-vi C-j send-keys -X page-down
bind -T copy-mode-vi C-k send-keys -X page-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
bind -T copy-mode-vi C-u send-keys -X halfpage-up
# Cari teks
bind / command-prompt -p"search:" "copy-mode -t=; send-keys -X search-forward \"%%\""
# List sessions
bind s choose-tree -s
bind w choose-tree -w
# Move windows
bind -r , swap-window -t -1  # F1 + , untuk pindahkan window ke kiri
bind -r . swap-window -t +1  # F1 + . untuk pindahkan window ke kanan

# Kill
bind x kill-pane
bind X kill-window
# Create new window
bind c new-window
# Enter copy mode with prefix key (F1 + [)
bind-key '[' copy-mode
# Reload config
bind r source-file ~/.tmux.conf



# Jalankan tpm (plugin manager)
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'

# Specific window style settings to make active window more visible with transparent background
# setw -g window-status-format "    #[bg=default,fg=#aaaaaa,nounderscore,noitalics] #I:#W#F    "
# setw -g window-status-current-format "    #[bg=#859900,fg=#ffffff,bold] #I:#W#F    "
#
# Performance optimization - increase interval to reduce CPU usage
set -g status-interval 2

# Waktu format tetap menggunakan format standar tmux

# Add tmux-menus plugin
set -g @plugin 'jaclu/tmux-menus'

# Removed git status plugin, using direct shell command instead

# Add tmux-continuum plugin untuk session management
set -g @plugin 'tmux-plugins/tmux-sessionist'


# Removed tmux-command-palette plugin for performance

# Add productivity plugins (lighter alternatives)
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# set -g @plugin 'nhdaly/tmux-better-mouse-mode'  # Disable this plugin to prevent conflicts with mouse behavior

# Removed which-key plugin for better performance
# set -g @plugin 'alexwforsythe/tmux-which-key'

# Removed tmux-neolazygit plugin for performance



# Standard tmux binding for Tab to switch to last pane (should work with F1 prefix)
bind-key Tab last-pane

# Removed which-key plugin for performance

# Removed tmux-neolazygit configuration

# Tambahkan konfigurasi untuk integrasi dengan neovim
# Buka neovim di pane baru
bind-key n run-shell -b 'tmux new-window -c "#{pane_current_path}" "nvim"'  # Buka nvim di window baru
bind-key -r C-n run-shell -b 'tmux split-window -h -c "#{pane_current_path}" "nvim"'  # Buka nvim di pane horizontal
bind-key -r C-v run-shell -b 'tmux split-window -v -c "#{pane_current_path}" "nvim"'  # Buka nvim di pane vertikal

# Konfigurasi kursor - menggunakan metode yang kompatibel dengan berbagai versi tmux
# Untuk kursor line, gunakan nilai terminfo yang benar
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'
set -ga terminal-overrides 'xterm*:XTSAVE:Ms=\E]52;%p1%s;%p2%s\E\\'
# Nilai 5-6 untuk kursor line (5=blok, 6=line berkedip)
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Removed lazygit shortcuts for performance



# Configure tmux-prefix-highlight
set -g @prefix_highlight_fg 'white'
set -g @prefix_highlight_bg 'red'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=white,bg=red'
set -g @prefix_highlight_output_prefix 'on'


# Tmux-menus key bindings
bind m run-shell -b '/home/xcode/.tmux/plugins/tmux-menus/items/main.sh'



# Tmux-sessionist key bindings
bind C-j command-prompt -p"join window from session: " "join-pane -h -s '%%'"
bind C-S-j command-prompt -p"join window from session: " "join-pane -v -s '%%'"


# Removed tmux-command-palette configuration

# Add margin/border to create space between content and status bar

# Set default window index to 1 instead of 0
set -g base-index 1

# Tmux toggle scratch for temporary panes


# Toggle functionality using zoom
bind-key t resize-pane -Z

# Toggle scratch pad functionality
# Toggle a special scratch pad pane that appears when needed
bind-key -T root F12 new-window -n scratch \; run-shell 'tmux resize-pane -t {last} -x 80 -y 10' \; send-keys 'cd #{pane_current_path}' Enter
bind-key -T prefix b new-window -a -n scratch -c "#{pane_current_path}" \; resize-pane -t - -x 80 -y 10  # Membuka scratch window
bind-key -T prefix B new-window -a -n scratch -c "#{pane_current_path}" \; resize-pane -t - -x 100 -y 20  # Membuka scratch window besar

# Custom command to open new pane with vertical split and run qwen
bind-key q split-window -h -c "#{pane_current_path}" \; send-keys "qwen" Enter

# Custom command to open new window and run qwen in the same path
bind-key Q new-window -c "#{pane_current_path}" \; send-keys "qwen" Enter

# Custom command to open new pane with vertical split and run opencode
bind-key e split-window -h -c "#{pane_current_path}" \; send-keys "opencode" Enter

# Custom command to open new window and run opencode in the same path
bind-key E new-window -c "#{pane_current_path}" \; send-keys "opencode" Enter



# Plugin untuk menyimpan dan memulihkan session tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin tambahan untuk pengalaman seperti Warp terminal
# Removed tmux-logging plugin for performance
# set -g @plugin 'nhdaly/tmux-better-mouse-mode'  # Dinonaktifkan untuk mencegah konflik dengan mouse scroll





# Konfigurasi tambahan untuk tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-bash-history 'on'

# Konfigurasi untuk tmux-continuum (simpan setiap 15 menit)
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Key binding untuk memeriksa info sistem saat dibutuhkan (lebih ringan daripada tampil terus)
bind C run-shell -b 'echo "CPU: $(/home/xcode/.tmux/system_info.sh cpu) | Memory: $(/home/xcode/.tmux/system_info.sh mem) | Load: $(/home/xcode/.tmux/system_info.sh load)" | tmux display-message -d 5000'



# Shortcut untuk manual save session sebelum shutdown/restart
# Gunakan F1 + Shift + S untuk menyimpan session secara manual
bind S run-shell -b "$HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh"

# Shortcut untuk membuka pane baru dengan custom path
# Gunakan F1 + Shift + P untuk membuka pane horizontal dengan custom path
bind P command-prompt -p"Enter path for new vertical pane (use ~ for home): " 'run-shell -b "HOME=/home/xcode; ~/.tmux/scripts/open-pane-h.sh \"%%\""'

# Shortcut untuk membuka pane baru dengan custom path (vertical)
# Gunakan F1 + Ctrl + P untuk membuka pane vertikal dengan custom path
bind -r C-p command-prompt -p"Enter path for new vertical pane (use ~ for home): " 'run-shell -b "HOME=/home/xcode; ~/.tmux/scripts/open-pane-v.sh \"%%\""'

# Shortcut untuk membuka window baru dengan custom path
# Gunakan F1 + Shift + W untuk membuka window baru dengan custom path
bind W command-prompt -p"Enter path for new window (use ~ for home): " 'run-shell -b "HOME=/home/xcode; ~/.tmux/scripts/open-window.sh \"%%\""'

# Removed tmux-cpu plugin configurations

# Tmux simple git status configuration
set -g @git-status-style-ahead ' fg=green'
set -g @git-status-style-behind ' fg=red'
set -g @git-status-style-diverged ' fg=yellow'
set -g @git-status-style-nobranch ' fg=red'
set -g @git-status-fmt ' %b %s %a %r'
set -g @git-status-interval 1
set -g @git-status-left-icon "/git"
set -g @git-status-right-icon "git/"
set -g @git-status-branch-icon "⎇"

# Set juga di level window - hapus opsi yang tidak kompatibel
# Opsi cursor-style dan cursor-blink tidak didukung di semua versi tmux

# Tambahkan dukungan untuk berbagai terminal
set -ga terminal-overrides 'xterm*:smkx@:rmkx@'
set -ga terminal-overrides 'xterm*:Ss=\E[%p1%d q:Se=\E[2 q'  # Standard reset sequence
set -ga terminal-overrides 'screen*:smkx@:rmkx@'
set -ga terminal-overrides 'tmux*:smkx@:rmkx@'
set -ga terminal-overrides 'xterm*:SetCursorStyle=\E[%p1%d q'

# Additional override to make sure that after vim exits, the cursor returns to line style
set -ga terminal-overrides 'xterm*:Se=\E[6 q'  # Reset to line cursor after vim/nvim exits

# Menambahkan hook untuk memastikan kursor kembali ke mode line setelah aplikasi selesai
set -ga terminal-overrides 'xterm*:SetCursorStyle=\E[6 q'

# Untuk mengaktifkan kursor line berkedip, Anda bisa menggunakan perintah berikut di terminal Anda:
# echo -e -n "\033]50;CursorShape=1\a"  # 0=block, 1=line, 2=underline

# Reset kursor ke line saat kembali dari aplikasi seperti nvim
bind-key r run-shell 'printf "\\033[6 q"'  # Reset kursor ke line (1=blink line, 6=steady line)

# Menambahkan hook untuk mengembalikan kursor ke mode line setelah aplikasi selesai
set -g @resurrect-process-command 'printf "\\033[6 q"'



# Perintah tambahan untuk memastikan kursor tetap dalam mode line

# Hook tambahan untuk memperbaiki kursor setelah keluar dari aplikasi
set -g @resurrect-save-shell-variables \"cursor\"

# Reset kursor ke mode line pada setiap prompt
set -g set-titles-string "\033[6 q"

# Konfigurasi tambahan untuk kompatibilitas dengan tmux 3.6+

# Wheel mouse scrolling (ini akan digunakan setelah konfigurasi utama)
bind -T root WheelUpPane if-shell -F -t = '#{mouse_any_flag}' 'send-keys -M' 'if -F "#{pane_in_mode}" "send-keys -M" "copy-mode -e; send-keys -M"'
bind -T root WheelDownPane if-shell -F -t = '#{mouse_any_flag}' 'send-keys -M' 'send-keys -M'
bind -T root MouseDragEnd1Pane if-shell -F -t = '#{mouse_any_flag}' 'send-keys -M' 'copy-mode -x; send-keys -M'
bind -T root MouseDrag1Pane if-shell -F -t = '#{mouse_any_flag}' 'send-keys -M' 'copy-mode -x; send-keys -M'
